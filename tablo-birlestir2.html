<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tablo</title>
  <style>
    table {
      border: 2px solid gray;
      border-spacing: 4px;
      width: 420px;
      height: 210px;
    }
    td {
      border: 2px solid gray;
      text-align: center;
      vertical-align: middle;
      font-size: 28px;
      font-family: "Times New Roman", serif;
    }
    .kirmizi { background: red; }
    .mor     { background: purple; }
    .sari    { background: yellow; }
  </style>
</head>
<body>

<table>
  <tr>
    <td>1</td>
    <td colspan="3">2</td>
  </tr>
  <tr>
    <td rowspan="3">3</td>
    <td class="kirmizi">4</td>
    <td class="mor">5</td>
    <td class="kirmizi" rowspan="2">6</td>
  </tr>
  <tr>
    <td class="kirmizi">7</td>
    <td class="mor">8</td>
  </tr>
  <tr>
    <td class="sari" colspan="2">9</td>
    <td class="mor">10</td>
  </tr>
</table>

</body>
</html>
